<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout - Scryptian</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --bg: #ffffff; --text: #0e0e10; --text-dim: #5b5b66; --accent: #2563eb; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
      font-family: "Manrope", "Segoe UI", system-ui, sans-serif;
      display: grid; place-items: center; text-align: center; padding: 24px;
    }
    .box { max-width: 480px; }
    .brand { font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: 22px; text-transform: uppercase; letter-spacing: 0.02em; }
    .brand .brand-sub { color: var(--accent); }
    .spinner {
      width: 40px; height: 40px; margin: 32px auto 16px;
      border: 3px solid #e7e8ec; border-top-color: var(--accent); border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { color: var(--text-dim); font-size: 15px; }
    .done { display: none; }
  </style>
</head>
<body>
  <div class="box">
    <div class="brand"><span>Scryptian</span><span class="brand-sub">.</span></div>
    <div class="spinner" id="spinner"></div>
    <p id="status">Opening checkout&hellip;</p>
    <div class="done" id="done">
      <p style="font-size:18px; color:#0e0e10; font-weight:700;">Payment complete</p>
      <p>You can close this window and return to Scryptian.</p>
    </div>
  </div>

  <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
  <script>
    Paddle.Environment.set("production");

    Paddle.Initialize({
      token: "live_42e7e633616b9a967a1975b6cf9",
      eventCallback: function (event) {
        if (event.name === "checkout.completed") {
          document.getElementById("spinner").style.display = "none";
          document.getElementById("status").style.display = "none";
          document.getElementById("done").style.display = "block";
        }
      },
    });

    var params = new URLSearchParams(window.location.search);
    var txnId = params.get("_ptxn");

    if (txnId) {
      Paddle.Checkout.open({ transactionId: txnId });
    } else {
      document.getElementById("spinner").style.display = "none";
      document.getElementById("status").textContent = "No checkout found. Please start a purchase from the app.";
    }
  </script>
