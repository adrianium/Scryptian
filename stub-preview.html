<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stub preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    /* Правь эти значения. После одобрения переносим их в stub.py. */
    :root {
      --stub-w: 380px;
      --page: #070C10;
      --bg: #0E171C;
      --text: #edecec;
      --text-dim: rgba(237, 236, 236, 0.55);
      --track: rgba(237, 236, 236, 0.08);
      --fill: #edecec;
      --error: #e6b3ad;
      --radius: 4px;
      --inset: 28px;
      --title-size: 16px;
      --body-size: 14px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      background: var(--page);
      color: var(--text);
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
    }

    .note {
      margin: 0;
      color: var(--text-dim);
      font-size: 14px;
      font-weight: 400;
    }

    .stub {
      width: var(--stub-w);
      background: var(--bg);
      border: none;
      border-radius: var(--radius);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px var(--inset) 24px;
    }

    .logo {
      width: 32px;
      height: 32px;
      margin: 0 0 16px;
      display: block;
    }

    .title {
      margin: 0;
      font-size: var(--title-size);
      font-weight: 500;
      line-height: 20px;
      letter-spacing: -0.2px;
    }

    .status {
      margin: 8px 0 0;
      color: var(--text-dim);
      font-size: var(--body-size);
      font-weight: 400;
      line-height: 18px;
      text-align: center;
    }

    .stub.is-error .status { color: var(--error); }

    .track {
      width: 100%;
      height: 4px;
      margin-top: 24px;
      background: var(--track);
      border: none;
      border-radius: 2px;
      overflow: hidden;
    }

    .fill {
      width: 42%;
      height: 100%;
      background: var(--fill);
      border-radius: 2px;
    }

    .stub.is-install .fill { width: 100%; }
    .stub.is-error .track,
    .stub.is-error .pct { visibility: hidden; }

    .pct {
      margin: 8px 0 0;
      color: var(--text-dim);
      font-size: var(--body-size);
      font-weight: 400;
      line-height: 18px;
    }

    .states { display: flex; gap: 8px; }

    .states button {
      height: 32px;
      padding: 0 12px;
      border: none;
      border-radius: 4px;
      background: var(--bg);
      color: var(--text);
      font: 400 14px/1 "IBM Plex Sans", "Segoe UI", sans-serif;
      cursor: pointer;
    }

    .states button.is-on {
      background: var(--text);
      color: var(--page);
    }
  </style>
</head>
<body>
  <p class="note">Макет стаба. Кнопки снизу только для просмотра состояний.</p>

  <div class="stub" id="stub">
    <img class="logo" src="landing/favicon.svg" alt="" />
    <p class="title">Scryptian</p>
    <p class="status" id="status">Getting Scryptian ready…</p>
    <div class="track"><div class="fill" id="fill"></div></div>
    <p class="pct" id="pct">42%</p>
  </div>

  <div class="states">
    <button type="button" class="is-on" data-state="download">Downloading</button>
    <button type="button" data-state="install">Installing</button>
    <button type="button" data-state="error">Error</button>
  </div>

  <script>
    const stub = document.getElementById("stub");
    const status = document.getElementById("status");
    const pct = document.getElementById("pct");
    const copy = {
      download: ["Downloading Scryptian…", "42%"],
      install: ["Installing…", "100%"],
      error: ["Download failed. Check your internet and try again.", ""]
    };
    document.querySelectorAll(".states button").forEach((btn) => {
      btn.addEventListener("click", () => {
        const state = btn.dataset.state;
        stub.className = "stub" + (state === "download" ? "" : " is-" + state);
        status.textContent = copy[state][0];
        pct.textContent = copy[state][1];
        document.querySelectorAll(".states button").forEach((b) => b.classList.toggle("is-on", b === btn));
      });
    });
  </script>
</body>
</html>
